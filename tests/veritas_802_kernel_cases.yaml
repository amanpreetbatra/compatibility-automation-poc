- id: go-upgrade-4.18.0-305-to-425
  description: Upgrade within the certified envelope
  os: rhel8
  current_kernel: 4.18.0-305.el8
  target_kernel: 4.18.0-425.el8
  applications:
    - name: veritas_infoscale
      version: 8.0.2
  expected:
    decision: GO
    highest_supported_kernel: 4.18.0-425.el8
    blocking_applications: []
  rationale: Target kernel is at the documented upper bound for Veritas 8.0.2 per PCL.

- id: no-go-upgrade-4.18.0-305-to-477
  description: Upgrade beyond certified upper bound
  os: rhel8
  current_kernel: 4.18.0-305.el8
  target_kernel: 4.18.0-477.el8
  applications:
    - name: veritas_infoscale
      version: 8.0.2
  expected:
    decision: NO_GO
    highest_supported_kernel: 4.18.0-425.el8
    blocking_applications:
      - veritas_infoscale
  rationale: 4.18.0-477.el8 is not documented as supported; cap at 4.18.0-425.el8.

- id: no-go-upgrade-4.18.0-193-to-513-multiapp
  description: Multi-application structure; Veritas blocks the upgrade at upper envelope
  os: rhel8
  current_kernel: 4.18.0-193.el8
  target_kernel: 4.18.0-513.el8
  applications:
    - name: veritas_infoscale
      version: 8.0.2
    - name: placeholder_app
      version: 1.0.0
  expected:
    decision: NO_GO
    highest_supported_kernel: 4.18.0-425.el8
    blocking_applications:
      - veritas_infoscale
  rationale: 4.18.0-513.el8 lies outside the documented envelope; the Veritas rule limits the kernel to 4.18.0-425.el8. Additional apps can be evaluated separately.
