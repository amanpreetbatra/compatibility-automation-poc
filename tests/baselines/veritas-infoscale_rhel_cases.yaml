- id: go-upgrade-within-envelope
  description: Upgrade within certified kernel envelope
  platform: rhel8
  current_version: 4.18.0-305.el8
  target_version: 4.18.0-425.el8
  applications:
    - name: veritas-infoscale
      version: "8.0.2"
  expected:
    decision: GO
    highest_supported_version: 4.18.0-425.el8
    blocking_applications: []
  rationale: >
    4.18.0-425.el8 is the documented upper bound for Veritas InfoScale 8.0.2 on RHEL 8.
    Upgrade from 4.18.0-305.el8 stays within the certified envelope.

- id: no-go-upgrade-beyond-upper-bound
  description: Upgrade beyond certified upper bound
  platform: rhel8
  current_version: 4.18.0-305.el8
  target_version: 4.18.0-477.el8
  applications:
    - name: veritas-infoscale
      version: "8.0.2"
  expected:
    decision: NO_GO
    highest_supported_version: 4.18.0-425.el8
    blocking_applications:
      - veritas-infoscale
  rationale: >
    4.18.0-477.el8 is explicitly listed as an unsupported kernel for Veritas InfoScale 8.0.2.
    Upgrade must be capped at 4.18.0-425.el8.

- id: no-go-multiapp-veritas-blocks
  description: Multi-app upgrade; Veritas InfoScale blocks at upper bound
  platform: rhel8
  current_version: 4.18.0-193.el8
  target_version: 4.18.0-513.el8
  applications:
    - name: veritas-infoscale
      version: "8.0.2"
    - name: other-app
      version: "1.0.0"
  expected:
    decision: NO_GO
    highest_supported_version: 4.18.0-425.el8
    blocking_applications:
      - veritas-infoscale
  rationale: >
    4.18.0-513.el8 exceeds the certified envelope for Veritas InfoScale 8.0.2.
    Even if other-app supports the target kernel, Veritas InfoScale blocks the upgrade.
